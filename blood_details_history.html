<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Sahaya - Blood Details History</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@700;800&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        "on-surface": "#201a19",
        "surface-container": "#f8ebe9",
        "primary": "#366759",
        "primary-fixed": "#b9eddc",
        "on-primary-container": "#0c4236",
        "secondary": "#815248",
        "background": "#fff8f7",
        "on-background": "#201a19",
        "surface-container-highest": "#ece0de",
        "surface": "#fff8f7",
        "primary-container": "#7cae9e",
        "on-primary": "#ffffff",
        "surface-container-lowest": "#ffffff"
      },
      fontFamily: {
        "headline": ["Manrope"],
        "body": ["Inter"],
      },
      borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "1.5rem", "full": "9999px"},
    },
  },
}
</script>
<style>
.material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
.bg-sahaya-gradient { background: linear-gradient(135deg, #F8EBE9 0%, #CFECE0 100%); }
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-sahaya-gradient min-h-screen font-body text-on-surface flex flex-col">

<!-- TopAppBar -->
<header class="bg-[#F8EBE9] dark:bg-slate-900 sticky top-0 z-50 flex justify-between items-center px-6 py-4 w-full">
<div class="flex items-center gap-4">
<button class="text-[#366759] dark:text-[#7CAE9E] hover:bg-[#CFECE0]/50 active:scale-95 duration-200 ease-in-out p-2 rounded-full flex items-center gap-1" onclick="window.history.back()">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline font-bold text-xl text-[#366759] tracking-tighter">Blood Details History</h1>
</div>
</header>

<main class="flex-grow flex flex-col items-center justify-start px-6 pt-6 pb-24 space-y-8 w-full max-w-lg mx-auto">
  <div id="loading-state" class="text-center text-on-surface-variant font-medium mt-10">Loading history...</div>
  <div id="empty-state" class="hidden text-center text-on-surface-variant font-medium mt-10">
     No blood history found. Update blood details on your dashboard to see trends here.
  </div>

  <div id="charts-container" class="hidden w-full space-y-8">
    <!-- Blood Sugar Chart -->
    <div class="w-full bg-surface-container-lowest p-5 rounded-2xl shadow-sm border border-primary-container/20">
       <h3 class="font-headline text-lg font-bold text-on-surface mb-4">Blood Sugar (mg/dL)</h3>
       <div class="relative h-64 w-full">
           <canvas id="sugarChart"></canvas>
       </div>
    </div>

    <!-- Hemoglobin Chart -->
    <div class="w-full bg-surface-container-lowest p-5 rounded-2xl shadow-sm border border-primary-container/20">
       <h3 class="font-headline text-lg font-bold text-on-surface mb-4">Hemoglobin (g/dL)</h3>
       <div class="relative h-64 w-full">
           <canvas id="hemoglobinChart"></canvas>
       </div>
    </div>
  </div>
</main>

<!-- Translate Button -->
<button onclick="openTranslatePage()" title="Translate" class="fixed top-3 z-[9999] right-6 text-[#366759] hover:bg-[#CFECE0]/50 active:scale-95 transition-all p-2 rounded-full bg-white/60 backdrop-blur-sm shadow-sm border border-white">
  <span class="material-symbols-outlined">translate</span>
</button>
<div id="google_translate_element" style="display:none;"></div>
<script src="translate.js"></script>

<script type="module" src="blood_history.js"></script>
</body>
</html>
