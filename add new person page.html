<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
  import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAsSMEzG_Up6pJwzBUSD8oW5VuY5XhmCuA",
    authDomain: "sahaya-ai.firebaseapp.com",
    projectId: "sahaya-ai",
    storageBucket: "sahaya-ai.firebasestorage.app",
    messagingSenderId: "648285547085",
    appId: "1:648285547085:web:756f7440911378888eca04",
    measurementId: "G-FQ3F0N3HE0"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  
  let currentUser = null;
  onAuthStateChanged(auth, (user) => {
    if (user) {
      currentUser = user;
    } else {
      window.location.href = 'login.html';
    }
  });

  const photoInput = document.getElementById('profile-photo-input');
  const avatarPreview = document.getElementById('avatar-preview');
  let photoDataUrl = avatarPreview ? avatarPreview.src : '';

  function compressImage(file, maxWidth, maxHeight, callback) {
    const reader = new FileReader();
    reader.onload = function(event) {
      const img = new Image();
      img.onload = function() {
        let width = img.width;
        let height = img.height;

        if (width > height) {
          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }
        } else {
          if (height > maxHeight) {
            width = Math.round((width * maxHeight) / height);
            height = maxHeight;
          }
        }

        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        // Compress as JPEG with 70% quality to avoid 1MB limit
        callback(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  }

  if (photoInput) {
    photoInput.addEventListener('change', function(e) {
      if (e.target.files && e.target.files[0]) {
        compressImage(e.target.files[0], 500, 500, function(compressedDataUrl) {
           photoDataUrl = compressedDataUrl;
           if (avatarPreview) avatarPreview.src = photoDataUrl;
        });
      }
    });
  }

  const addProfileForm = document.getElementById('add-profile-form');
  if (addProfileForm) {
    addProfileForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      if (!currentUser) {
        alert("You must be logged in to create a profile.");
        return;
      }
      
      const submitBtn = document.querySelector('#add-profile-form button[type="submit"]');
      const originalText = submitBtn.innerText;
      submitBtn.innerText = "Saving...";
      submitBtn.disabled = true;

      const name = document.getElementById('profile-name').value;
      const age = document.getElementById('profile-age').value;
      const gender = document.getElementById('profile-gender').value;
      
      try {
        await addDoc(collection(db, "profiles"), {
          userId: currentUser.uid,
          name: name,
          age: age,
          gender: gender,
          photo: photoDataUrl || '',
          createdAt: new Date().toISOString()
        });
        window.location.href = 'index.html';
      } catch (error) {
        console.error("Error adding document: ", error);
        alert("Failed to create profile. " + error.message);
        submitBtn.innerText = originalText;
        submitBtn.disabled = false;
      }
    });
  }
</script>
