<body class="bg-background text-on-background font-body min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-[#F8EBE9] dark:bg-stone-900 flex justify-between items-center px-6 py-4 w-full sticky top-0 z-50">
<div class="flex items-center gap-4">
<button id="logout-btn" title="Log out" aria-label="Log out" class="text-[#366759] dark:text-[#7CAE9E] hover:bg-[#CFECE0]/50 transition-colors p-2 rounded-full active:scale-95">
<span class="material-symbols-outlined">logout</span>
</button>
<h1 class="font-headline font-black text-[#366759] dark:text-[#7CAE9E] tracking-widest text-2xl uppercase">SAHAYA</h1>
</div>
<div class="bg-primary w-10 h-10 rounded-full flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-white text-[24px]" style="font-variation-settings: 'FILL' 1;">spa</span>
</div>
</header>
<main class="flex-grow container mx-auto px-6 py-12 max-w-xl">
<!-- Profile Selection Section -->
<section class="mb-16">
<div class="mb-10 text-center">
<h2 class="font-headline text-4xl font-extrabold text-primary tracking-tight mb-2" data-i18n="profiles_title">Welcome Back</h2>
<p class="text-on-surface-variant text-lg" data-i18n="profiles_subtitle">Who is using Sahaya today?</p>
</div>
<div class="flex flex-col gap-6" id="profiles-container">
<!-- User Profiles Rendered Here Dynamically -->
<!-- Add New Profile Card -->
<button class="border-2 border-dashed border-outline-variant p-8 rounded-2xl flex flex-col items-center justify-center text-center group cursor-pointer hover:bg-primary/5 hover:border-primary transition-all duration-300 min-h-[160px] w-full" onclick="window.location.href='add-new-person.html'">
<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center mb-4 group-hover:scale-110 transition-transform shadow-sm group-hover:shadow-md">
<span class="material-symbols-outlined text-primary text-3xl">add</span>
</div>
<span class="font-headline font-bold text-primary"><span class="material-symbols-outlined align-middle !text-lg mr-1">add</span> <span data-i18n="profiles_add">+ Add New Profile</span></span>
</button>
</div>
</section>
</main>
<!-- BottomNavBar -->
<!-- Translate Button -->
<button onclick="openTranslatePage()" title="Translate" class="fixed top-3 z-[9999] right-16 text-[#366759] hover:bg-[#CFECE0]/50 active:scale-95 transition-all p-2 rounded-full bg-white/60 backdrop-blur-sm shadow-sm">

</button>
