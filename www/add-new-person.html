<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SAHAYA - Create New Profile</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "background": "#fff8f7",
              "on-surface-variant": "#404945",
              "on-tertiary-container": "#014142",
              "error": "#ba1a1a",
              "tertiary-container": "#79adad",
              "on-tertiary-fixed-variant": "#164e4f",
              "on-primary-fixed": "#002019",
              "on-tertiary": "#ffffff",
              "tertiary": "#326667",
              "tertiary-fixed-dim": "#9bd0d0",
              "on-primary-container": "#0c4236",
              "surface-container-highest": "#ece0de",
              "on-secondary": "#ffffff",
              "inverse-on-surface": "#fbeeec",
              "secondary-container": "#fec0b3",
              "tertiary-fixed": "#b7ecec",
              "on-background": "#201a19",
              "inverse-surface": "#362f2e",
              "secondary": "#815248",
              "secondary-fixed": "#ffdad3",
              "surface-variant": "#ece0de",
              "on-surface": "#201a19",
              "on-error": "#ffffff",
              "surface-dim": "#e4d7d5",
              "error-container": "#ffdad6",
              "surface-tint": "#366759",
              "surface": "#fff8f7",
              "on-primary-fixed-variant": "#1d4f42",
              "on-secondary-container": "#7a4c42",
              "outline": "#707975",
              "inverse-primary": "#9ed1c0",
              "surface-bright": "#fff8f7",
              "on-secondary-fixed-variant": "#663b32",
              "on-secondary-fixed": "#32110b",
              "on-primary": "#ffffff",
              "surface-container-high": "#f2e5e3",
              "on-tertiary-fixed": "#002020",
              "surface-container-low": "#fef1ef",
              "primary-fixed-dim": "#9ed1c0",
              "outline-variant": "#c0c8c4",
              "primary-fixed": "#b9eddc",
              "secondary-fixed-dim": "#f5b8ab",
              "primary": "#366759",
              "on-error-container": "#93000a",
              "surface-container-lowest": "#ffffff",
              "primary-container": "#7cae9e",
              "surface-container": "#f8ebe9"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {
              "DEFAULT": "0.5rem",
              "lg": "0.5rem",
              "xl": "0.75rem",
              "2xl": "1.5rem",
              "full": "9999px"
            },
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .avatar-glow {
        background: radial-gradient(circle, #BFF5F5 0%, #CFECE0 100%);
      }
      .btn-gradient {
        background: linear-gradient(135deg, #366759 0%, #7CAE9E 100%);
      }
      body {
        min-height: 100dvh;
      }
    </style>
<link rel="icon" type="image/png" href="logo.png"><link rel="manifest" href="manifest.json"></head>
<body class="bg-background text-on-background font-body flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="bg-[#F8EBE9] dark:bg-stone-900 flex justify-between items-center px-6 py-4 w-full sticky top-0 z-50">
<div class="flex items-center gap-4">
<a class="text-[#366759] dark:text-[#7CAE9E] hover:bg-[#CFECE0]/50 transition-colors p-2 rounded-full active:scale-95" href="index.html">
<span class="material-symbols-outlined">arrow_back</span>
</a>
<h1 class="font-['Manrope'] font-black text-[#366759] dark:text-[#7CAE9E] tracking-widest text-2xl uppercase">Sahaya</h1>
</div>
<div class="bg-[#366759] p-2 rounded-full flex items-center justify-center w-10 h-10 shadow-sm">
<span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;">spa</span>
</div>
</header>
<main class="flex-grow container mx-auto px-6 py-8 pb-32 max-w-xl">
<!-- Create Profile Section -->
<section class="bg-surface-container-lowest rounded-2xl p-8 shadow-[0_4px_40px_rgba(32,26,25,0.04)] border border-surface-container">
<div class="text-center mb-10">
<h2 class="font-headline text-3xl font-extrabold text-primary mb-2" data-i18n="add_profile_title">Create New Profile</h2>
<p class="text-on-surface-variant" data-i18n="add_profile_subtitle">Tell us a bit about who's joining</p>
</div>
<form class="space-y-8" id="add-profile-form">
<!-- Avatar Preview -->
<div class="flex justify-center mb-8">
<div class="avatar-glow p-2 rounded-full w-32 h-32 relative">
<img alt="New Profile" class="w-full h-full object-cover rounded-full" id="avatar-preview" src="logo.png"/>
<label class="absolute bottom-1 right-1 bg-primary text-white p-2 rounded-full shadow-lg cursor-pointer active:scale-90 transition-transform">
<span class="material-symbols-outlined text-sm">photo_camera</span>
<input type="file" id="profile-photo-input" accept="image/*" class="hidden" />
</label>
</div>
</div>
<div class="space-y-6">
<div>
<label class="block text-sm font-semibold text-primary mb-2 ml-1" data-i18n="add_profile_name">Full Name</label>
<input id="profile-name" class="w-full bg-surface-container-highest border-none rounded-lg px-4 py-4 focus:ring-2 focus:ring-primary/20 text-on-surface placeholder:opacity-40 transition-all outline-none" data-i18n-placeholder="add_profile_name_ph" placeholder="Enter name" required="" type="text"/>
</div>
<div class="grid grid-cols-2 gap-6">
<div>
<label class="block text-sm font-semibold text-primary mb-2 ml-1" for="profile-age" data-i18n="add_profile_age">Age</label>
<input id="profile-age" class="w-full bg-surface-container-highest border-none rounded-lg px-4 py-4 focus:ring-2 focus:ring-primary/20 text-on-surface placeholder:opacity-40 transition-all outline-none" data-i18n-placeholder="add_profile_age_ph" placeholder="Years" required="" min="0" max="120" type="number"/>
<p id="age-error" class="hidden text-error text-xs font-semibold mt-2 ml-1"></p>
</div>
<div>
<label class="block text-sm font-semibold text-primary mb-2 ml-1" for="profile-gender" data-i18n="add_profile_gender">Gender</label>
<select id="profile-gender" class="w-full bg-surface-container-highest border-none rounded-lg px-4 py-4 focus:ring-2 focus:ring-primary/20 text-on-surface appearance-none outline-none" required="">
<option disabled="" selected="" value="" data-i18n="add_profile_gender_ph">Select</option>
<option value="male" data-i18n="gender_male">Male</option>
<option value="female" data-i18n="gender_female">Female</option>
<option value="other" data-i18n="gender_other">Other</option>
</select>
</div>
</div>
</div>
<div class="pt-6">
<button class="w-full btn-gradient py-4 rounded-lg text-white font-headline font-bold text-lg shadow-lg shadow-primary/20 active:scale-95 transition-all" id="save-btn" type="submit">
<span id="save-spinner" class="material-symbols-outlined animate-spin hidden mr-2">sync</span>
<span id="save-label" data-i18n="add_profile_btn">Continue</span>
</button>
</div>
</form>
</section>
</main>
<!-- BottomNavBar -->
<!-- Translate Button -->
<button onclick="openTranslatePage()" title="Translate" aria-label="Translate this page" class="fixed top-3 z-[9999] right-4 text-[#366759] hover:bg-[#CFECE0]/50 active:scale-95 transition-all p-2 rounded-full bg-white/60 backdrop-blur-sm shadow-sm border border-white">
  <span class="material-symbols-outlined">translate</span>
</button>
<script src="util.js"></script>
<script src="firebase-config.js"></script>
<script src="app-config.js"></script>
</body>
</html>
</body></html>
