<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SAHAYA - Symptom Check</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>

        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "background": "#fff8f7",
              "on-surface-variant": "#404945",
              "on-tertiary-container": "#014142",
              "error": "#ba1a1a",
              "tertiary-container": "#79adad",
              "on-tertiary-fixed-variant": "#164e4f",
              "on-primary-fixed": "#002019",
              "on-tertiary": "#ffffff",
              "tertiary": "#326667",
              "tertiary-fixed-dim": "#9bd0d0",
              "on-primary-container": "#0c4236",
              "surface-container-highest": "#ece0de",
              "on-secondary": "#ffffff",
              "inverse-on-surface": "#fbeeec",
              "secondary-container": "#fec0b3",
              "tertiary-fixed": "#b7ecec",
              "on-background": "#201a19",
              "inverse-surface": "#362f2e",
              "secondary": "#815248",
              "secondary-fixed": "#ffdad3",
              "surface-variant": "#ece0de",
              "on-surface": "#201a19",
              "on-error": "#ffffff",
              "surface-dim": "#e4d7d5",
              "error-container": "#ffdad6",
              "surface-tint": "#366759",
              "surface": "#fff8f7",
              "on-primary-fixed-variant": "#1d4f42",
              "on-secondary-container": "#7a4c42",
              "outline": "#707975",
              "inverse-primary": "#9ed1c0",
              "surface-bright": "#fff8f7",
              "on-secondary-fixed-variant": "#663b32",
              "on-secondary-fixed": "#32110b",
              "on-primary": "#ffffff",
              "surface-container-high": "#f2e5e3",
              "on-tertiary-fixed": "#002020",
              "surface-container-low": "#fef1ef",
              "primary-fixed-dim": "#9ed1c0",
              "outline-variant": "#c0c8c4",
              "primary-fixed": "#b9eddc",
              "secondary-fixed-dim": "#f5b8ab",
              "primary": "#366759",
              "on-error-container": "#93000a",
              "surface-container-lowest": "#ffffff",
              "primary-container": "#7cae9e",
              "surface-container": "#f8ebe9"
            },
            fontFamily: {

              "label": ["Inter"]

        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-nav {
            background: rgba(255, 248, 247, 0.7);
            backdrop-filter: blur(20px);
        }
        .sound-wave-bar {
            width: 3px;
            background-color: white;
            border-radius: 99px;
            margin: 0 1px;
        }
        body {
          min-height: max(884px, 100dvh);
        }
    </style>
<link rel="icon" type="image/png" href="logo.png"><link rel="manifest" href="manifest.json"></head>
<body class="bg-background text-on-background font-body min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-[#F8EBE9] dark:bg-stone-900 flex justify-between items-center px-6 py-4 w-full sticky top-0 z-50">
<div class="flex items-center gap-4">
<a id="symptoms-back-link" aria-label="Back to dashboard" class="text-[#366759] dark:text-[#7CAE9E] hover:bg-[#CFECE0]/50 transition-colors p-2 rounded-full active:scale-95 active:duration-150 flex items-center" href="dashboard.html">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
<span class="ml-1 font-bold text-sm hidden sm:inline">BACK</span>
</a>
<h1 class="font-['Manrope'] font-black text-[#366759] dark:text-[#7CAE9E] tracking-widest text-2xl">SAHAYA</h1>
</div>
<div class="flex items-center gap-3">
<div id="patient-block" class="text-right hidden sm:block">
<p class="text-xs font-bold text-primary uppercase tracking-tighter">Current Patient</p>
<p id="patient-name" class="text-sm font-semibold text-on-surface">&nbsp;</p>
</div>
<div class="w-10 h-10 rounded-full bg-gradient-to-tr from-[#BFF5F5] to-[#CFECE0] p-0.5">
<img id="patient-avatar" alt="Current patient profile" class="w-full h-full rounded-full object-cover border-2 border-white" src="logo.png"/>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col w-full max-w-4xl mx-auto px-4 pt-6 pb-32 relative">
<!-- Context Header -->
<div class="mb-8 text-center sm:text-left">
<h2 class="font-headline text-3xl font-extrabold text-primary tracking-tight mb-2" data-i18n="symptom_title">Symptom Checker</h2>
<p class="text-on-surface-variant max-w-md" data-i18n="symptom_subtitle">Describe how you're feeling. Sahaya is here to assist with preliminary guidance.</p>
</div>
<!-- Chat History Container -->
<div id="chat-container" class="space-y-6 flex flex-col pb-6">
    <!-- Messages will be injected here -->
</div>
<!-- Typing Indicator -->
<div id="typing-indicator" class="hidden flex-col items-start gap-4 mt-4">
    <div class="flex items-center gap-3 self-start">
        <div class="bg-surface-container-low px-4 py-2 rounded-full flex items-center gap-2 shadow-sm border border-outline-variant/20">
            <div class="flex gap-1">
                <span class="w-1.5 h-1.5 bg-primary/40 rounded-full animate-bounce"></span>
                <span class="w-1.5 h-1.5 bg-primary/60 rounded-full animate-bounce" style="animation-delay: 0.1s"></span>
                <span class="w-1.5 h-1.5 bg-primary rounded-full animate-bounce" style="animation-delay: 0.2s"></span>
            </div>
            <span class="text-xs font-semibold text-primary/80 italic" data-i18n="symptom_analyzing">Analyzing...</span>
        </div>
    </div>
</div>
</main>
<!-- Translate Button -->
<button onclick="openTranslatePage()" title="Translate" aria-label="Translate" class="fixed top-3 z-[9999] right-4 text-[#366759] hover:bg-[#CFECE0]/50 active:scale-95 transition-all p-2 rounded-full bg-white/60 backdrop-blur-sm shadow-sm">
  <span class="material-symbols-outlined">translate</span>
</button>
<script src="util.js"></script>
<script src="firebase-config.js"></script>
<script src="app-config.js"></script>
<script src="i18n.js"></script>
<script src="voice.js"></script>
<!-- Bottom Action Bar / Input -->
<div class="fixed bottom-0 left-0 w-full z-40 px-4 pb-8 pt-2 bg-gradient-to-t from-background via-background/95 to-transparent">
<div class="max-w-4xl mx-auto flex items-center gap-3">
<!-- Text Input Container -->
<div class="flex-1 bg-surface-container-highest rounded-xl flex items-center px-4 py-2 shadow-inner border border-outline-variant/30">
<input id="user-input" aria-label="Describe your symptoms" data-i18n-placeholder="symptom_placeholder" class="flex-1 bg-transparent border-none focus:ring-0 text-on-surface placeholder:text-outline text-[15px] font-medium py-2 outline-none" placeholder="Type your symptoms..." type="text"/>
<button id="send-btn" aria-label="Send message" class="text-primary p-2 hover:bg-primary/10 rounded-full transition-colors active:scale-95">
<span class="material-symbols-outlined" data-icon="send">send</span>
</button>
</div>
<!-- Voice Interaction Container -->
<div id="mic-btn" role="button" tabindex="0" aria-label="Speak your symptoms" class="flex items-center gap-3 bg-primary rounded-xl px-5 py-3 shadow-lg active:scale-95 transition-transform cursor-pointer relative overflow-hidden">
<div id="mic-waves" class="hidden items-center h-4 gap-[2px] absolute inset-0 justify-center bg-primary z-10 w-full">
<div class="sound-wave-bar h-2 animate-pulse"></div>
<div class="sound-wave-bar h-4 animate-pulse"></div>
<div class="sound-wave-bar h-3 animate-pulse"></div>
<div class="sound-wave-bar h-5 animate-pulse"></div>
<div class="sound-wave-bar h-3 animate-pulse"></div>
</div>
<button class="text-white flex items-center gap-2 relative z-0">
<span class="material-symbols-outlined" data-icon="mic" data-weight="fill" style="font-variation-settings: 'FILL' 1;">mic</span>
<span id="mic-text" class="hidden sm:inline font-bold text-sm tracking-wide" data-i18n="symptom_mic_speak">SPEAK</span>
</button>
</div>
</div>
</div>
</body>
<script type="module">
    import { db, requireAuth } from "./auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";
    import { saveAssessment, getPastAssessmentSummaries } from "./history-store.js";

    const U = window.SAHAYA_UTIL;
    const I18N = window.SAHAYA_I18N;
    const Voice = window.SAHAYA_VOICE;
    const t = I18N ? I18N.t.bind(I18N) : (k) => k;

    let messages = [];
    let awaitingReply = false;

    const chatContainer = document.getElementById('chat-container');
    const typingIndicator = document.getElementById('typing-indicator');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const micBtn = document.getElementById('mic-btn');
    const micWaves = document.getElementById('mic-waves');
    const micText = document.getElementById('mic-text');

    // Language configuration — from i18n.js
    const langCode = I18N ? I18N.getLang() : 'en';
    const langName = I18N ? I18N.getLangName() : 'English';
    const speechCode = I18N ? I18N.getSpeechCode() : 'en-IN';

    // ── Auth + patient context ────────────────────────────────────────────────
    const user = await requireAuth();
    const profileId = sessionStorage.getItem('currentProfileId') || '-';

    // Back link keeps the selected profile.
    const backLink = document.getElementById('symptoms-back-link');
    if (backLink && profileId !== '-') {
        backLink.href = 'dashboard.html?id=' + encodeURIComponent(profileId);
    }

    // Show the REAL selected patient.
    let profileData = null;
    try {
        const snap = await getDoc(doc(db, "profiles", profileId));
        if (snap.exists() && snap.data().userId === user.uid) {
            profileData = snap.data();
            const nameEl = document.getElementById('patient-name');
            const avatarEl = document.getElementById('patient-avatar');
            if (nameEl) nameEl.textContent = profileData.name || '';
            if (avatarEl && profileId !== '-') avatarEl.src = U.profilePhoto(profileData);
        } else {
            const block = document.getElementById('patient-block');
            if (block) block.style.display = 'none';
        }
    } catch (e) {
        console.error("Could not load patient profile:", e);
        const block = document.getElementById('patient-block');
        if (block) block.style.display = 'none';
    }

    // ── Load health context for Gemini ────────────────────────────────────────
    // Gemini receives past health issues so it can give better suggestions.
    let healthContext = null;
    try {
        // Weight history
        const weightHistory = profileData && profileData.weightHistory ? profileData.weightHistory : {};
        const weightKeys = Object.keys(weightHistory).sort().reverse();
        const latestWeight = weightKeys.length > 0 ? weightHistory[weightKeys[0]] : null;

        // Blood history
        const bloodHistory = profileData && profileData.bloodHistory ? profileData.bloodHistory : [];
        const sortedBlood = [...bloodHistory].sort((a, b) => new Date(b.date) - new Date(a.date));
        const latestBlood = sortedBlood.length > 0 ? sortedBlood[0] : null;

        // Past assessment summaries from Firestore
        let pastAssessments = [];
        try {
            pastAssessments = await getPastAssessmentSummaries(db, user.uid, profileId, 5);
        } catch (e) {
            console.warn("Could not load past assessments:", e);
        }

        healthContext = {
            latestWeight: latestWeight,
            latestBloodSugar: latestBlood ? latestBlood.sugar : null,
            latestHemoglobin: latestBlood ? latestBlood.hemoglobin : null,
            bloodGroup: profileData ? profileData.bloodGroup : null,
            pastAssessments: pastAssessments,
            pastAssessmentCount: pastAssessments.length,
            pastRiskLevels: pastAssessments.map(a => a.riskLevel)
        };
    } catch (e) {
        console.warn("Could not build health context:", e);
    }

    // ── Chat storage: scoped per user + profile ───────────────────────────────
    const saveMessages = () =>
        U.scopedSetItem('sahaya_chat', user.uid, profileId, JSON.stringify(messages));

    // ── Voice Input via voice.js ──────────────────────────────────────────────
    let isListening = false;

    function stopListeningUI() {
        isListening = false;
        micWaves.classList.add('hidden');
        micWaves.classList.remove('flex');
        micText.textContent = t('symptom_mic_speak');
    }

    function startListeningUI() {
        isListening = true;
        micWaves.classList.remove('hidden');
        micWaves.classList.add('flex');
        micText.textContent = t('symptom_mic_listening');
    }

    micBtn.addEventListener('click', async () => {
        if (awaitingReply) return;

        if (isListening) {
            if (Voice) Voice.stopListening();
            stopListeningUI();
            return;
        }

        // Stop any ongoing TTS before listening
        if (Voice) Voice.stopSpeaking();

        startListeningUI();
        try {
            const transcript = await Voice.listen(langCode);
            stopListeningUI();
            if (transcript && transcript.trim()) {
                userInput.value = transcript;
                handleSend();
            }
        } catch (e) {
            console.error('Voice listen error:', e);
            stopListeningUI();
            U.toast(t('error_generic'), 'error');
        }
    });

    // ── Text-to-Speech via voice.js ──────────────────────────────────────────
    function speakText(text) {
        if (Voice) Voice.speak(text, langCode);
    }

    // ── UI helpers ────────────────────────────────────────────────────────────
    function addMessageToUI(role, content, isRestoring = false) {
        const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        const msgDiv = document.createElement('div');
        msgDiv.className = role === 'assistant' ? "flex justify-start w-full gap-3" : "flex justify-end w-full";

        const displayContent = U.escapeHtml(String(content).replace(/\*\*/g, ''));

        if (role === 'assistant') {
            msgDiv.innerHTML = `
                <div class="w-10 h-10 shrink-0 rounded-xl bg-gradient-to-br from-[#366759] to-[#7CAE9E] flex items-center justify-center self-start border-2 border-white shadow-sm shadow-[#366759]/20">
                    <span class="material-symbols-outlined text-white" style="font-size: 22px; font-variation-settings: 'FILL' 1;">spa</span>
                </div>
                <div class="max-w-[85%] sm:max-w-[70%] bg-[#CFECE0] text-on-primary-container px-6 py-4 rounded-t-xl rounded-br-xl shadow-sm">
                    <p class="text-[15px] leading-relaxed whitespace-pre-line">${displayContent}</p>
                    <span class="text-[10px] opacity-60 mt-2 block font-medium uppercase tracking-widest">${time}</span>
                </div>
            `;
            if (!isRestoring) speakText(String(content).replace(/\*\*/g, ''));
        } else {
            msgDiv.innerHTML = `
                <div class="max-w-[85%] sm:max-w-[70%] bg-[#FEC0B3] text-on-secondary-container px-6 py-4 rounded-t-xl rounded-bl-xl shadow-sm">
                    <p class="text-[15px] leading-relaxed whitespace-pre-line">${displayContent}</p>
                    <span class="text-[10px] opacity-60 mt-2 block font-medium uppercase tracking-widest text-right">${time}</span>
                </div>
            `;
        }
        chatContainer.appendChild(msgDiv);
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    function setAwaiting(v) {
        awaitingReply = v;
        sendBtn.disabled = v;
        sendBtn.style.opacity = v ? '0.5' : '1';
        userInput.disabled = v;
    }

    async function fetchAIResponse() {
        setAwaiting(true);
        typingIndicator.classList.remove('hidden');
        typingIndicator.classList.add('flex');
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

        const cfg = window.SAHAYA_BACKEND.chat;

        if (messages.length === 0) {
            let contextStr = `PATIENT CONTEXT:\n`;
            if (profileData) {
                contextStr += `Patient Profile: Name: ${profileData.name}, Age: ${profileData.age}, Gender: ${profileData.gender}\n`;
            } else {
                contextStr += `Patient Profile: Unknown\n`;
            }
            if (healthContext) {
                contextStr += `Health History:\n`;
                if (healthContext.latestWeight) contextStr += `- Latest Weight: ${healthContext.latestWeight} kg\n`;
                if (healthContext.bloodGroup) contextStr += `- Blood Group: ${healthContext.bloodGroup}\n`;
                if (healthContext.latestBloodSugar) contextStr += `- Latest Blood Sugar: ${healthContext.latestBloodSugar} mg/dL\n`;
                if (healthContext.latestHemoglobin) contextStr += `- Latest Hemoglobin: ${healthContext.latestHemoglobin} g/dL\n`;
                
                if (healthContext.pastAssessments && healthContext.pastAssessments.length > 0) {
                    contextStr += `- Past Assessments:\n`;
                    healthContext.pastAssessments.forEach((a, i) => {
                        contextStr += `  ${i+1}. ${a.summary} (Risk: ${a.riskLevel})\n`;
                    });
                } else {
                    contextStr += `- No recent past assessments recorded.\n`;
                }
            } else {
                contextStr += `No Health History.\n`;
            }

            const pName = profileData && profileData.name ? profileData.name : 'the patient';
            const starterContent = `[SYSTEM INSTRUCTION]\n${contextStr}\n\nStart the consultation. Greet ${pName} warmly and ask your first question about their health concern. Respond in ${langName}.`;
            
            messages.push({ role: 'user', content: starterContent, hidden: true });
        }

        try {
            const data = await U.fetchJson(cfg.url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + cfg.anonKey
                },
                body: JSON.stringify({
                    messages: messages,
                    language: langName,
                    languageCode: langCode
                })
            }, cfg.timeoutMs);

            messages.push({ role: 'assistant', content: data.content });
            saveMessages();

            if (data.finished) {
                const assessmentResult = {
                    riskLevel: data.riskLevel,
                    summary: data.summary,
                    content: data.content,
                    dos: data.dos || [],
                    donts: data.donts || []
                };
                U.scopedSetItem('sahaya_result', user.uid, profileId, JSON.stringify(assessmentResult));
                U.scopedRemoveItem('sahaya_chat', user.uid, profileId);

                // ── Save to Firestore history ────────────────────────────────
                try {
                    await saveAssessment(db, user.uid, profileId, {
                        riskLevel: data.riskLevel,
                        summary: data.summary,
                        content: data.content,
                        dos: data.dos || [],
                        donts: data.donts || [],
                        chatMessages: messages,
                        language: langCode,
                        patientData: profileData ? {
                            name: profileData.name,
                            age: profileData.age,
                            gender: profileData.gender
                        } : null,
                        healthContext: healthContext
                    });
                } catch (histErr) {
                    console.error("Failed to save assessment to history:", histErr);
                    // Non-blocking — results page still works from localStorage.
                }

                const finalMsgDiv = document.createElement('div');
                finalMsgDiv.className = "flex flex-col items-start gap-4 mt-2 mb-8";
                finalMsgDiv.innerHTML = `
                <div class="flex items-center gap-3 self-start">
                    <div class="bg-surface-container-low px-4 py-2 rounded-full flex items-center gap-3">
                        <span class="material-symbols-outlined text-primary" style="font-size: 18px;">check_circle</span>
                        <span class="text-xs font-semibold text-primary/80 italic" data-i18n="symptom_assessment_complete">${t('symptom_assessment_complete')}</span>
                    </div>
                </div>
                <div class="w-full flex justify-center py-4">
                    <a class="bg-primary text-white px-8 py-3 rounded-xl font-bold text-sm tracking-widest flex items-center gap-2 shadow-lg hover:bg-primary/90 transition-all active:scale-95 uppercase" href="results.html">
                        ${t('symptom_view_result')}
                        <span class="material-symbols-outlined !text-lg" data-icon="arrow_forward">arrow_forward</span>
                    </a>
                </div>
                `;
                chatContainer.appendChild(finalMsgDiv);
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                speakText(t('symptom_assessment_complete'));

                setTimeout(() => {
                    window.location.href = 'results.html';
                }, 4000);
            } else {
                addMessageToUI('assistant', data.content);
            }
        } catch (error) {
            console.error("AI request failed:", error);
            addMessageToUI('assistant', error.message || t('error_generic'));
        } finally {
            typingIndicator.classList.add('hidden');
            typingIndicator.classList.remove('flex');
            setAwaiting(false);
        }
    }

    function handleSend() {
        if (awaitingReply) return;
        const text = userInput.value.trim();
        if (!text) return;

        userInput.value = '';
        addMessageToUI('user', text);
        messages.push({ role: 'user', content: text });
        saveMessages();

        if (Voice) Voice.stopSpeaking();
        fetchAIResponse();
    }

    // ── Init conversation ─────────────────────────────────────────────────────
    (function initChat() {
        const savedChat = U.scopedGetItem('sahaya_chat', user.uid, profileId);
        let shouldFetchInitial = true;

        if (savedChat) {
            try {
                const parsed = JSON.parse(savedChat);
                if (parsed && parsed.length > 0) {
                    messages = parsed.filter(m => m && (m.role === 'user' || m.role === 'assistant'));
                    messages.forEach(msg => {
                        if (!msg.hidden) {
                            addMessageToUI(msg.role, msg.content, true);
                        }
                    });
                    shouldFetchInitial = false;
                    setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'instant' }), 100);
                }
            } catch (e) {
                console.error("Error parsing chat history", e);
                U.scopedRemoveItem('sahaya_chat', user.uid, profileId);
            }
        }

        if (shouldFetchInitial) {
            // Play voice greeting before first AI fetch
            if (Voice) Voice.greet('symptom_voice_greeting');
            fetchAIResponse();
        }
    })();

    sendBtn.addEventListener('click', handleSend);
    userInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') handleSend();
    });

    // Translate page navigation
    window.openTranslatePage = function () {
        var page = window.location.href.split('/').pop().split('?')[0];
        localStorage.setItem('sahaya_translate_return', page);
        window.location.href = 'translate.html';
    };
</script>
</body>
