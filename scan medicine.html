<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SAHAYA - Medicine Scanner</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

              "on-tertiary": "#ffffff",
              "tertiary": "#326667",
              "tertiary-fixed-dim": "#9bd0d0",
              "on-primary-container": "#0c4236",
              "surface-container-highest": "#ece0de",
              "on-secondary": "#ffffff",
              "inverse-on-surface": "#fbeeec",
              "secondary-container": "#fec0b3",
              "tertiary-fixed": "#b7ecec",
              "on-background": "#201a19",
              "inverse-surface": "#362f2e",
              "secondary": "#815248",
              "secondary-fixed": "#ffdad3",
              "surface-variant": "#ece0de",

              "surface-container-high": "#f2e5e3",
              "on-tertiary-fixed": "#002020",
              "surface-container-low": "#fef1ef",
              "primary-fixed-dim": "#9ed1c0",
              "outline-variant": "#c0c8c4",
              "primary-fixed": "#b9eddc",
              "secondary-fixed-dim": "#f5b8ab",
              "primary": "#366759",
              "on-error-container": "#93000a",
              "surface-container-lowest": "#ffffff",

              "surface-container": "#f8ebe9"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Inter"],
              "label": ["Inter"]

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .scanner-frame {
            background: linear-gradient(to right, #7cae9e 4px, transparent 4px) 0 0,
                        linear-gradient(to right, #7cae9e 4px, transparent 4px) 0 100%,
                        linear-gradient(to left, #7cae9e 4px, transparent 4px) 100% 0,
                        linear-gradient(to left, #7cae9e 4px, transparent 4px) 100% 100%,
                        linear-gradient(to bottom, #7cae9e 4px, transparent 4px) 0 0,
                        linear-gradient(to bottom, #7cae9e 4px, transparent 4px) 100% 0,
                        linear-gradient(to top, #7cae9e 4px, transparent 4px) 0 100%,
                        linear-gradient(to top, #7cae9e 4px, transparent 4px) 100% 100%;
            background-repeat: no-repeat;
            background-size: 40px 40px;
        }
        .scan-line {
            height: 2px;
            background: linear-gradient(90deg, transparent, #7cae9e, transparent);
            box-shadow: 0 0 15px #7cae9e;
            top: 0;
            left: 0;
            width: 100%;
        }
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
<link rel="icon" type="image/png" href="logo.png"><link rel="manifest" href="manifest.json"></head>
<body class="bg-background font-body text-on-background min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-[#F8EBE9] dark:bg-stone-900 flex justify-between items-center px-6 py-4 w-full fixed top-0 z-50">
<div class="flex items-center gap-4">
<button class="material-symbols-outlined text-[#366759] cursor-pointer hover:bg-black/5 p-1 rounded-full transition-colors" onclick="window.location.href='login.html'">arrow_back</button>
<h1 class="font-headline font-black text-[#366759] dark:text-[#7CAE9E] tracking-widest text-2xl uppercase">SAHAYA</h1>
</div>
<div class="relative group">
<div class="w-10 h-10 rounded-full bg-gradient-to-tr from-[#BFF5F5] to-[#CFECE0] flex items-center justify-center overflow-hidden">
<img alt="User" class="w-9 h-9 object-cover rounded-full" data-alt="User profile avatar with mint aura" src="https://lh3.googleusercontent.com/aida-public/AB6AXuByV2WScPSwDJZCcEIYfMxb1tplLfX5aSYv2zvLclRfTW6jxJqWXabmCDILO1l1Tw2W9KJ58PkcC6MwhUwzvFPAS2mC31Lf3aKjIVRDAbMleNpKB5MeEaTv7gHJkg5I6yvv9G985SHFLeQ_gZkNzVo9ucIumw6F7zJS0lLYrKWA4uehbtwECSZ_6Mgl-LMjq_boVZk-P3HxQb9oHQJe5nrh9CBteVQLDZtLCRK8seqIx8r1m3rPa55EXKIdqrE_yatENqNIvkm_2Oc"/>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 mt-16 pb-24 overflow-y-auto px-6 max-w-2xl mx-auto w-full flex flex-col items-center gap-8 pt-8">
<div id="scanner-view" class="w-full flex-col flex gap-8">
<!-- Camera Viewfinder Section -->
<div class="w-full aspect-[4/5] bg-surface-container relative overflow-hidden rounded-2xl shadow-sm">
<!-- Simulated Camera Background -->
<div class="absolute inset-0 bg-stone-800">
<video id="camera-stream" class="w-full h-full object-cover opacity-80" autoplay playsinline muted></video>
</div>
<!-- Scanner Box Overlay -->
<div class="absolute inset-0 flex items-center justify-center p-12 pointer-events-none">
<div class="w-full h-full scanner-frame relative rounded-2xl pointer-events-none">
<!-- Scan Line Animation -->
<div id="scan-line" class="scan-line absolute hidden" style="top: 40%;"></div>
</div>
</div>
<!-- Viewfinder Instructions -->
<div class="absolute bottom-6 left-0 right-0 text-center px-4 pointer-events-none">
<p id="scan-text" class="text-white font-medium drop-shadow-md text-sm bg-black/30 backdrop-blur-md inline-block px-4 py-2 rounded-full">
                    Center the medicine label within the frame
                </p>
</div>
</div>
<!-- Scanning Actions -->
<div class="flex items-center justify-center gap-6 w-full relative z-20">
<button id="btn-gallery" class="w-14 h-14 rounded-full bg-surface-container-highest flex items-center justify-center text-on-surface-variant hover:bg-[#CFECE0]/50 transition-colors active:scale-95 duration-150 relative z-30">
<span class="material-symbols-outlined" data-icon="photo_library">photo_library</span>
</button>
<button id="btn-capture" class="w-20 h-20 rounded-full border-4 border-[#366759] p-1 flex items-center justify-center active:scale-90 transition-transform relative z-30">
<div class="w-full h-full rounded-full bg-gradient-to-br from-[#366759] to-[#7cae9e] flex items-center justify-center shadow-lg pointer-events-none">
<span class="material-symbols-outlined text-white text-3xl" data-icon="camera">camera</span>
</div>
</button>
<button id="btn-flash" class="w-14 h-14 rounded-full bg-surface-container-highest flex items-center justify-center text-on-surface-variant hover:bg-[#CFECE0]/50 transition-colors active:scale-95 duration-150 relative z-30">
<span class="material-symbols-outlined" data-icon="flashlight_on">flashlight_on</span>
</button>
</div>
</div>
<!-- Result Modal / Card -->
<div id="result-card" class="hidden w-full bg-surface-container-lowest rounded-2xl p-6 shadow-[0_8px_32px_rgba(54,103,89,0.08)] border border-primary-container/20">
<div class="flex items-start justify-between mb-4">
<div>
<span class="text-[10px] font-bold uppercase tracking-widest text-primary-container mb-1 block">Diagnosis Result</span>
<h2 id="res-name" class="text-2xl font-headline font-bold text-primary"></h2>
</div>
<div class="w-12 h-12 bg-secondary-container rounded-xl flex items-center justify-center text-on-secondary-container pointer-events-none">
<span class="material-symbols-outlined" data-icon="medication">medication</span>
</div>
</div>
<div class="space-y-6">
<!-- Info Grid -->
<div class="grid grid-cols-1 gap-4">
<div class="p-4 bg-primary-container/10 rounded-lg">
<h4 class="text-xs font-bold text-primary uppercase mb-1">Purpose</h4>
<p id="res-purpose" class="text-sm text-on-surface"></p>
</div>
<div class="p-4 bg-primary-container/10 rounded-lg">
<h4 class="text-xs font-bold text-primary uppercase mb-1">Usage</h4>
<p id="res-usage" class="text-sm text-on-surface"></p>
</div>
</div>
<!-- Warning Banner -->
<div id="warning-banner" class="hidden bg-[#E69EA2]/20 border border-[#E69EA2]/30 p-4 rounded-lg flex items-start gap-3">
<span class="material-symbols-outlined text-[#E69EA2]" data-icon="warning">warning</span>
<p id="res-warning" class="text-xs font-semibold text-[#815248]"></p>
</div>
<!-- Actions -->
<div class="flex gap-3 pt-2">
<button class="flex-1 py-4 px-6 bg-gradient-to-r from-primary to-primary-container text-white rounded-2xl font-bold text-sm shadow-md active:scale-95 transition-transform" onclick="resetScanner()">
                        Scan Another
                    </button>
<button class="flex-1 py-4 px-6 bg-secondary-container text-on-secondary-container rounded-2xl font-bold text-sm active:scale-95 transition-transform" onclick="window.location.href='dashboard.html'">
                        Back to Dashboard
                    </button>
</div>
</div>
</div>
</main>
<!-- BottomNavBar -->
<!-- Translate Button -->
<button onclick="openTranslatePage()" title="Translate" class="fixed top-3 z-[9999] right-16 text-[#366759] hover:bg-[#CFECE0]/50 active:scale-95 transition-all p-2 rounded-full bg-white/60 backdrop-blur-sm shadow-sm">
  <span class="material-symbols-outlined">translate</span>
</button>
<div id="google_translate_element" style="display:none;"></div>
<canvas id="scan-canvas" class="hidden"></canvas>
<input type="file" id="file-input" class="hidden" accept="image/*" capture="environment">
<script src="translate.js"></script>
<script src="scan_medicine.js"></script>
<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("service-worker.js").then(reg => console.log("SW Registered", reg)).catch(err => console.log("SW Failed", err));}</script></body></html>
