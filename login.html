<body class="min-h-screen flex items-center justify-center p-6 text-on-surface">
<div class="w-full max-w-md space-y-12">
<!-- Brand Identity Section -->
<header class="flex flex-col items-center space-y-4">
<div class="w-20 h-20 rounded-2xl btn-primary-gradient flex items-center justify-center shadow-xl">
<span class="material-symbols-outlined text-white text-4xl" data-icon="spa" style="font-variation-settings: 'FILL' 1;">spa</span>
</div>
<h1 class="font-headline font-extrabold text-4xl tracking-tighter text-primary">SAHAYA</h1>
</header><div class="flex flex-col items-center pt-2 pb-6">
<button class="w-full flex items-center justify-between bg-[#7CAE9E] text-white p-6 rounded-2xl shadow-xl hover:opacity-90 active:scale-[0.98] transition-all group" onclick="window.location.href='scan medicine.html'">
<div class="flex items-center gap-4">
<div class="bg-white/20 p-3 rounded-xl">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">document_scanner</span>
</div>
<div class="text-left">
<h3 class="font-headline font-extrabold text-xl leading-tight">Scan Medicine</h3>
<p class="text-white/80 text-sm font-medium">Check details instantly</p>
</div>
</div>
<span class="material-symbols-outlined text-3xl group-hover:translate-x-1 transition-transform">arrow_forward_ios</span>
</button>
</div>
<!-- Login Container -->
<main class="space-y-10">
<div class="text-center space-y-2">
<h2 class="font-headline font-bold text-2xl text-on-surface">Login to Sahaya</h2>
<p class="text-on-surface-variant font-medium opacity-80">Access your health and wellness sanctuary</p>
</div>
<!-- Form Flow -->
<div class="space-y-8">
<!-- Phone Number Entry -->
<div class="space-y-4">
<div class="relative">
<label class="block text-sm font-semibold text-primary mb-2 ml-1" for="phone">Enter Phone Number</label>
<div class="flex items-center bg-surface-container-highest rounded-xl px-5 py-4 focus-within:ring-2 focus-within:ring-primary/20 transition-all">
<span class="material-symbols-outlined text-on-surface-variant mr-3" data-icon="call">call</span>
<input class="bg-transparent border-none w-full focus:ring-0 text-lg font-medium placeholder:text-outline/50 p-0" id="phone" placeholder="e.g. 9876543210" type="tel"/>
</div>
</div>
<button class="w-full btn-primary-gradient text-white font-headline font-bold py-5 px-6 rounded-2xl shadow-lg shadow-primary/20 hover:opacity-90 active:scale-95 transition-all text-lg tracking-wide uppercase">
                        Send OTP
                    </button>
</div>
<!-- Visual Separator / Tonal Shift -->
<div class="flex items-center justify-center py-2">
<div class="h-px w-full bg-outline-variant/30"></div>
</div>
<!-- OTP Entry -->
<div class="space-y-4">
<div class="relative">
<label class="block text-sm font-semibold text-primary mb-2 ml-1" for="otp">Enter 6-digit OTP</label>
<div class="flex items-center bg-surface-container-highest rounded-xl px-5 py-4 focus-within:ring-2 focus-within:ring-primary/20 transition-all">
<span class="material-symbols-outlined text-on-surface-variant mr-3" data-icon="lock">lock</span>
<input class="bg-transparent border-none w-full focus:ring-0 text-2xl font-bold tracking-[0.5em] placeholder:text-outline/30 p-0" id="otp" maxlength="6" placeholder="· · · · · ·" type="text"/>
</div>
</div>
<button class="w-full btn-primary-gradient text-white font-headline font-bold py-5 px-6 rounded-2xl shadow-lg shadow-primary/20 hover:opacity-90 active:scale-95 transition-all text-lg tracking-wide uppercase" onclick="alert('Please use Google Login for now, OTP is not implemented in this demo.')">
                        Submit
                    </button>
</div>
<!-- Visual Separator -->
<div class="flex items-center justify-center py-4 relative">
<div class="h-px w-full bg-outline-variant/30"></div>
<span class="absolute bg-surface px-4 text-sm font-semibold text-on-surface-variant">OR</span>
</div>
<!-- Google Login -->
<button id="google-login-btn" class="w-full bg-white text-on-surface flex items-center justify-center gap-3 font-headline font-bold py-4 px-6 rounded-2xl shadow-sm border border-outline-variant hover:bg-surface-container-lowest active:scale-95 transition-all text-[16px] tracking-wide">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo" class="w-6 h-6"/>
    Continue with Google
</button>
</div>
<!-- Rural-Friendly Support Link -->
<div class="text-center pt-4">
<a class="text-primary font-bold text-sm hover:underline flex items-center justify-center gap-2" href="#">
<span class="material-symbols-outlined text-base" data-icon="help_outline">help_outline</span>
                    Need help logging in?
                </a>
</div>
</main>

</div>
<p class="text-center text-[10px] uppercase tracking-[0.2em] mt-6 text-on-surface-variant font-bold">Trusted by over 10,000 rural families</p>
</footer>
</div>

<button onclick="openTranslatePage()" title="Translate" class="fixed top-3 z-[9999] right-4 text-[#366759] hover:bg-[#CFECE0]/50 active:scale-95 transition-all p-2 rounded-full bg-white/60 backdrop-blur-sm shadow-sm">

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAsSMEzG_Up6pJwzBUSD8oW5VuY5XhmCuA",
    authDomain: "sahaya-ai.firebaseapp.com",
    projectId: "sahaya-ai",
    storageBucket: "sahaya-ai.firebasestorage.app",
    messagingSenderId: "648285547085",
    appId: "1:648285547085:web:756f7440911378888eca04",
    measurementId: "G-FQ3F0N3HE0"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  document.getElementById('google-login-btn').addEventListener('click', () => {
    signInWithPopup(auth, provider)
      .then((result) => {
        window.location.href = 'index.html';
      }).catch((error) => {
        console.error("Error during Google Login:", error);
        alert("Google Login Failed: " + error.message);
      });
  });
</script>
