<script>
    const SUPABASE_URL = "https://zglcrgarasocrhkchcvl.supabase.co/functions/v1/sahaya-chat";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpnbGNyZ2FyYXNvY3Joa2NoY3ZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2MDcxMDksImV4cCI6MjA5MDE4MzEwOX0.B6HwAdEBLa_1Ql20Z753ntNKXxoeLXzaLkdcBydsiHg";

    let messages = [];

    const chatContainer = document.getElementById('chat-container');
    const typingIndicator = document.getElementById('typing-indicator');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const micBtn = document.getElementById('mic-btn');
    const micWaves = document.getElementById('mic-waves');
    const micText = document.getElementById('mic-text');

    // Language configuration
    const langCode = localStorage.getItem('sahaya_lang') || 'en';
    const langMap = {
        en: 'English', hi: 'Hindi', ta: 'Tamil', te: 'Telugu',
        kn: 'Kannada', ml: 'Malayalam', bn: 'Bengali', mr: 'Marathi',
        gu: 'Gujarati', pa: 'Punjabi'
    };
    const speechCodeMap = {
        en: 'en-IN', hi: 'hi-IN', ta: 'ta-IN', te: 'te-IN',
        kn: 'kn-IN', ml: 'ml-IN', bn: 'bn-IN', mr: 'mr-IN',
        gu: 'gu-IN', pa: 'pa-IN'
    };
    const langName = langMap[langCode] || 'English';
    const speechCode = speechCodeMap[langCode] || 'en-IN';

    // Speech Recognition
    let recognition = null;
    let isListening = false;
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.lang = speechCode;
        recognition.interimResults = false;

        recognition.onstart = () => {
            isListening = true;
            micWaves.classList.remove('hidden');
            micWaves.classList.add('flex');
            micText.textContent = "LISTENING";
            // remove pulse class from mic button when listening to avoid double animation
        };

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            userInput.value = transcript;
            handleSend();
        };

        recognition.onerror = (event) => {
            console.error('Speech recognition error', event.error);
            stopListeningUI();
        };

        recognition.onend = () => {
             stopListeningUI();
        };
    }

    function stopListeningUI() {
        isListening = false;
        micWaves.classList.add('hidden');
        micWaves.classList.remove('flex');
        micText.textContent = "SPEAK";
    }

    // TTS
    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); // Cancel any ongoing speech
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = speechCode;
            utterance.rate = 1.0;
            // Optionally select a specific voice if available
            const voices = window.speechSynthesis.getVoices();
            const matchingVoice = voices.find(v => v.lang.startsWith(langCode));
            if (matchingVoice) utterance.voice = matchingVoice;
            window.speechSynthesis.speak(utterance);
        }
    }

    // Initialize Conversation
    window.addEventListener('DOMContentLoaded', () => {
        // Restore chat history if exists
        const savedChat = localStorage.getItem('sahaya_chat_messages');
        let shouldFetchInitial = true;
        
        if (savedChat) {
            try {
                const parsed = JSON.parse(savedChat);
                if (parsed && parsed.length > 0) {
                    messages = parsed;
                    messages.forEach(msg => addMessageToUI(msg.role, msg.content, true));
                    shouldFetchInitial = false;
                    
                    // Re-scroll to bottom after render
                    setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'instant' }), 100);
                }
            } catch (e) {
                console.error("Error parsing chat history", e);
            }
        }
        
        if (shouldFetchInitial) {
            fetchAIResponse();
        }
    });

    function addMessageToUI(role, content, isRestoring = false) {
        const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        const msgDiv = document.createElement('div');
        msgDiv.className = role === 'assistant' ? "flex justify-start w-full gap-3" : "flex justify-end w-full";
        
        if (role === 'assistant') {
            // Strip markdown strong tags for display since we are rendering plain text mostly
            const displayContent = content.replace(/\*\*/g, '');
            msgDiv.innerHTML = `
                <div class="w-10 h-10 shrink-0 rounded-xl bg-gradient-to-br from-[#366759] to-[#7CAE9E] flex items-center justify-center self-start border-2 border-white shadow-sm shadow-[#366759]/20">
                    <span class="material-symbols-outlined text-white" style="font-size: 22px; font-variation-settings: 'FILL' 1;">spa</span>
                </div>
                <div class="max-w-[85%] sm:max-w-[70%] bg-[#CFECE0] text-on-primary-container px-6 py-4 rounded-t-xl rounded-br-xl shadow-sm">
                    <p class="text-[15px] leading-relaxed whitespace-pre-line">${displayContent}</p>
                    <span class="text-[10px] opacity-60 mt-2 block font-medium uppercase tracking-widest">${time}</span>
                </div>
            `;
            // Speak the response if the user just spoke or as default
            if (!isRestoring) speakText(displayContent);
        } else {
            msgDiv.innerHTML = `
                <div class="max-w-[85%] sm:max-w-[70%] bg-[#FEC0B3] text-on-secondary-container px-6 py-4 rounded-t-xl rounded-bl-xl shadow-sm">
                    <p class="text-[15px] leading-relaxed whitespace-pre-line">${content}</p>
                    <span class="text-[10px] opacity-60 mt-2 block font-medium uppercase tracking-widest text-right">${time}</span>
                </div>
            `;
        }
        chatContainer.appendChild(msgDiv);
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    async function fetchAIResponse() {
        typingIndicator.classList.remove('hidden');
        typingIndicator.classList.add('flex');
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

        try {
            console.log("Fetching AI Response with messages:", messages);
            const response = await fetch(SUPABASE_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + SUPABASE_KEY
                },
                body: JSON.stringify({ 
                    messages: messages,
                    language: langName,
                    languageCode: langCode
                })
            });

            if (!response.ok) {
                console.error("API Error", response.status);
                addMessageToUI('assistant', "I'm having trouble connecting to my servers right now. Please try again later.");
                return;
            }

            const data = await response.json();
            console.log("Data returned:", data);
            
            // Add Assistant message to history
            messages.push({ role: 'assistant', content: data.content });
            localStorage.setItem('sahaya_chat_messages', JSON.stringify(messages));
            
            if (data.finished) {
                const assessmentResult = {
                    riskLevel: data.riskLevel,
                    summary: data.summary,
                    content: data.content,
                    dos: data.dos || [],
                    donts: data.donts || []
                };
                localStorage.setItem('sahaya_assessment_result', JSON.stringify(assessmentResult));
                
                // Clear chat progress since assessment is complete
                localStorage.removeItem('sahaya_chat_messages');
                
                // Show analyzing UI before redirect
                const finalMsgDiv = document.createElement('div');
                finalMsgDiv.className = "flex flex-col items-start gap-4 mt-2 mb-8";
                finalMsgDiv.innerHTML = `
                <div class="flex items-center gap-3 self-start">
                    <div class="bg-surface-container-low px-4 py-2 rounded-full flex items-center gap-2">
                        <span class="material-symbols-outlined text-primary" style="font-size: 18px;">check_circle</span>
                        <span class="text-xs font-semibold text-primary/80 italic">Assessment Complete</span>
                    </div>
                </div>
                <div class="w-full flex justify-center py-4">
                    <a class="bg-primary text-white px-8 py-3 rounded-xl font-bold text-sm tracking-widest flex items-center gap-2 shadow-lg hover:bg-primary/90 transition-all active:scale-95 uppercase" href="results.html">
                        View Assessment Result
                        <span class="material-symbols-outlined !text-lg" data-icon="arrow_forward">arrow_forward</span>
                    </a>
                </div>
                `;
                chatContainer.appendChild(finalMsgDiv);
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                speakText("My assessment is complete. Redirecting you to the results.");
                
                setTimeout(() => {
                    window.location.href = 'results.html';
                }, 4000);
            } else {
                addMessageToUI('assistant', data.content);
            }
        } catch (error) {
            console.error("Fetch Error", error);
            addMessageToUI('assistant', "Something went wrong. Please check your connection.");
        } finally {
            typingIndicator.classList.add('hidden');
            typingIndicator.classList.remove('flex');
        }
    }

    function handleSend() {
        const text = userInput.value.trim();
        if (!text) return;
        
        userInput.value = '';
        
        // Add User message
        addMessageToUI('user', text);
        messages.push({ role: 'user', content: text });
        localStorage.setItem('sahaya_chat_messages', JSON.stringify(messages));
        
        // Stop any ongoing speech
        window.speechSynthesis.cancel();
        
        fetchAIResponse();
    }

    sendBtn.addEventListener('click', handleSend);
    userInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            handleSend();
        }
    });

    micBtn.addEventListener('click', () => {
        if (!recognition) {
            alert("Speech recognition is not supported in this browser.");
            return;
        }
        if (isListening) {
            recognition.stop();
        } else {
            recognition.start();
        }
    });

    // To ensure speech synthesis works (requires user interaction first)
    // and initialize voices
    window.speechSynthesis.onvoiceschanged = () => {
        // Voices loaded
    };
</script>
